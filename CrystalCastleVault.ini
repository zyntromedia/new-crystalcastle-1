# 🤝 แนวทางการมีส่วนร่วม

ก่อนอื่น — ขอบคุณที่สละเวลาเข้ามาช่วยเหลือ! ทุกการมีส่วนร่วมมีความหมาย 💜

---

## 🛣️ วิธีการมีส่วนร่วม

### 1. แจ้งปัญหา
- ค้นหาปัญหาที่มีอยู่ก่อน — เพื่อหลีกเลี่ยงการสร้างซ้ำซ้อน
- ใช้แม่แบบที่เหมาะสม (แจ้งข้อผิดพลาด / ขอฟีเจอร์)

### 2. ส่งการเปลี่ยนแปลง
```bash
# ขั้นที่ 1 — จำลองและดาวน์โหลด
git clone https://github.com/yourname/project.git
cd project
git remote add upstream https://github.com/organization/project.git

# ขั้นที่ 2 — สร้างสาขาสำหรับฟีเจอร์
git checkout -b feat/คำอธิบายแบบย่อ

# ขั้นที่ 3 — ทำการเปลี่ยนแปลงแล้วบันทึก
git add .
git commit -m "feat: เพิ่มคำอธิบายแบบย่อ"

# ขั้นที่ 4 — ส่งและเปิดคำขอรวมโค้ด
git push -u origin feat/คำอธิบายแบบย่อ
```

### 3. รูปแบบข้อความบันทึกการเปลี่ยนแปลง
```
ประเภท(ขอบเขต): ข้อความ

ประเภท: feat | fix | docs | refactor | test | chore | ci
ตัวอย่าง: feat(ระบบเข้าสู่ระบบ): เพิ่มทางเลือกเข้าสู่ระบบแบบ SSO
```

### 4. ขั้นตอนการส่งคำขอรวมโค้ด
- เชื่อมโยงปัญหา: `Fixes #123`
- กรอกข้อมูลในแม่แบบให้ครบถ้วน
- ตรวจสอบให้แน่ใจว่าการตรวจสอบอัตโนมัติผ่าน
- รอการตรวจสอบ → ปรับตามข้อเสนอ → รวมโค้ด

### 5. มาตรฐานโค้ด
- ตรวจสอบรูปแบบและจัดรูปแบบก่อนส่ง
- เขียนกรณีทดสอบสำหรับฟีเจอร์ใหม่
- ปรับปรุงเอกสารเมื่อมีการเปลี่ยนแปลงการทำงาน

---

## 📞 การสื่อสารและการทำงานร่วมกัน
- **สาขาหลัก**: `main` — ได้รับการปกป้อง ต้องผ่านคำขอรวมโค้ด
- **กฎสาขา**: ต้องมีผู้ตรวจสอบอย่างน้อย 1 คน + การตรวจสอบอัตโนมัติผ่าน
- **ป้ายกำกับ**: `bug` · `enhancement` · `needs-triage` · `wip`
- **ผู้ตรวจสอบ**: กำหนดอัตโนมัติตามไฟล์ `.github/CODEOWNERS`
- **การสนทนา**: ใช้ส่วนที่สนทนาใน GitHub สำหรับคำถาม/แนวคิดต่างๆ

---

## ✅ ข้อตกลงการยอมรับผลงาน
โดยการส่งผลงาน คุณยินยอมให้ผลงานของคุณรวมอยู่ภายใต้สัญญาอนุญาตที่มีอยู่
