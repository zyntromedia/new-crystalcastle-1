# 🤝 Contributing Guidelines

First off — thank you for investing your time! Every contribution helps. 💜

---

## 🛣️ How to Contribute

### 1. Report Issues
- Search existing issues first — avoid duplicates
- Use the appropriate template (Bug / Feature Request)

### 2. Submit Changes
```bash
# Step 1 — Fork & clone
git clone https://github.com/yourname/project.git
cd project
git remote add upstream https://github.com/organization/project.git

# Step 2 — Create a feature branch
git checkout -b feat/short-description

# Step 3 — Make changes, then commit
git add .
git commit -m "feat: add short description"

# Step 4 — Push and open PR
git push -u origin feat/short-description
```

### 3. Commit Message Convention
```
type(scope): message

Types: feat | fix | docs | refactor | test | chore | ci
Example: feat(auth): add SSO login option
```

### 4. Pull Request Process
- Link the issue: `Fixes #123`
- Fill the PR template completely
- Ensure CI checks pass
- Await review → address feedback → squash & merge

### 5. Code Standards
- Lint & format before submitting
- Write tests for new features
- Update docs for changed behavior

---

## 📞 Collaboration & Communication
- **Main branch**: `main` — protected, requires PR
- **Branch protection**: 1+ approval + passing CI
- **Labels**: `bug` · `enhancement` · `needs-triage` · `wip`
- **Reviewers**: Assigned automatically via `.github/CODEOWNERS`
- **Discussions**: Use GitHub Discussions for Q&A / ideas

---

## ✅ Developer Certificate of Origin
By contributing, you agree your contributions may be included under the existing license.
```

