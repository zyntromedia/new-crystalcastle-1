# 🔑 CODEOWNERS Reference

> Maps files/paths to responsible reviewers. Used by GitHub to auto-assign PR reviews.

## Syntax
```
# Path                      Owners
*.md                       @org/docs-reviewer
*.js                       @org/frontend-team
.github/workflows/*         @org/devops-team
```

## Common Patterns
| Path | Assigned Reviewers |
|---|---|
| `*.en.md` | @org/docs-reviewer |
| `*.th.md` | @org/thai-translation-team |
| `docs/**/*` | @org/docs-reviewer |
| `scripts/*` | @org/devops-team |
| `*.yml` | @org/devops-team |

## Notes
- Owners can be users, teams, or emails
- First matching path wins
- Applies to **all PRs** — cannot be bypassed
- Actual CODEOWNERS file: `.github/CODEOWNERS` (no extension, no frontmatter)
```

