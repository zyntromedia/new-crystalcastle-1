## 📌 Guidelines
- ✅ **Up-to-date**: Translation matches English source
- ⚠️ **Needs review**: English source changed → re-translate
- ❌ **Missing**: Thai file does not exist yet
- Always keep code blocks, links, paths, and technical terms in English
- Update `last-synced` date and set `needs-review: false` after translating
