# 🤝 การทำงานร่วมกันและการปกครองโครงการ

## 🧑‍💻 ผู้ดูแลโครงการ
- **@maintainer1** — หัวหน้าผู้ดูแลโครงการ
- **@maintainer2** — สถาปัตยกรรม / ความปลอดภัย

## 🔑 สิทธิ์
- **อ่าน** — ผู้มีส่วนร่วมทุกคน
- **จัดการปัญหา** — ติดป้ายกำกับ จัดการเป้าหมาย
- **เขียน** — สร้างสาขา รวมโค้ดที่ได้รับการตรวจสอบแล้ว
- **ดูแลรักษา** — เผยแพร่รุ่น จัดการตั้งค่าต่างๆ
- **ผู้ดูแลระบบ** — จัดการคลังทั้งหมด

## 📋 ขั้นตอนการตรวจสอบ
1. เปิดคำขอรวมโค้ด → กำหนดผู้ตรวจสอบอัตโนมัติตาม CODEOWNERS
2. ตรวจสอบภายใน **2 วันทำการ**
3. หากมีข้อเสนอแนะ → ปรับปรุงและขอตรวจสอบอีกครั้ง
4. เมื่อได้รับความเห็นชอบ + การตรวจสอบผ่าน → **รวมโค้ดเป็นข้อความเดียว**

## 🔄 ขั้นตอนการเผยแพร่
1. ปรับปรุงบันทึกการเปลี่ยนแปลง
2. ปรับหมายเลขรุ่นในไฟล์ `package.json` / `pyproject.toml`
3. สร้างป้ายกำกับ: `git tag v1.2.3`
4. ส่งป้ายกำกับ → สร้างหน้าเผยแพร่บน GitHub อัตโนมัติ
5. เผยแพร่แพ็กเกจ

## ⚖️ การตัดสินใจ
- การเปลี่ยนแปลงเล็กน้อย: ผู้ดูแลตรวจสอบแล้ว ✅
- การเปลี่ยนแปลงสำคัญ: เปิดปัญหา → **รับฟังความคิดเห็น 7 วัน** → ผู้ดูแลตกลงร่วมกัน
- การเปลี่ยนแปลงที่ไม่เข้ากับรุ่นก่อนหน้า: ต้องได้รับการยินยอม + มีเอกสารอธิบายการย้าย
```

