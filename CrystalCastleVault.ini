# 🤝 Collaboration & Governance

## 🧑‍💻 Maintainers
- **@maintainer1** — Lead Maintainer
- **@maintainer2** — Architecture / Security

## 🔑 Permissions
- **Read** — All contributors
- **Triage** — Label issues, manage milestones
- **Write** — Push branches, merge approved PRs
- **Maintain** — Publish releases, manage settings
- **Admin** — Full repository administration

## 📋 Review Workflow
1. PR opened → auto-assigned reviewers via CODEOWNERS
2. Review within **2 business days**
3. Changes requested → address & re-request review
4. Approved + CI passes → **Squash & Merge**

## 🔄 Release Process
1. Changelog updated
2. Version bumped in `package.json` / `pyproject.toml`
3. Tag created: `git tag v1.2.3`
4. Push tag → GitHub Release auto-created
5. Package published

## ⚖️ Decision Making
- Minor changes: Maintainer review ✅
- Major changes: Open issue → **7-day comment period** → Maintainer consensus
- Breaking changes: Design approval + migration docs required
```

