# 🔑 เอกสารอ้างอิง CODEOWNERS

> กำหนดว่าใครรับผิดชอบตรวจสอบโค้ดตามเส้นทางไฟล์ GitHub ใช้เพื่อกำหนดผู้ตรวจสอบโดยอัตโนมัติ

## รูปแบบ
```
# เส้นทางไฟล์               ผู้รับผิดชอบ
*.md                       @org/docs-reviewer
*.js                       @org/frontend-team
.github/workflows/*         @org/devops-team
```

## รูปแบบที่ใช้บ่อย
| เส้นทางไฟล์ | ผู้ตรวจสอบที่รับผิดชอบ |
|---|---|
| `*.en.md` | @org/docs-reviewer |
| `*.th.md` | @org/thai-translation-team |
| `docs/**/*` | @org/docs-reviewer |
| `scripts/*` | @org/devops-team |
| `*.yml` | @org/devops-team |

## หมายเหตุ
- ผู้รับผิดชอบอาจเป็นบุคคล ทีม หรืออีเมล
- ใช้ข้อกำหนดแรกที่ตรงกัน
- มีผลกับ **ทุกคำขอรวมโค้ด** — ข้ามไม่ได้
- ไฟล์จริงวางที่ `.github/CODEOWNERS` (ไม่มีนามสกุลไฟล์)
```

